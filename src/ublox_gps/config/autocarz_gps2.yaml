ublox_gps_node:
  ros__parameters:
    debug: 1
    device: /dev/ttyACM2
    frame_id: gps_front
    config_on_startup: false
    uart1:
      baudrate: 460800
      in: 32
      out: 3
    usb:
      in: 35
      out: 3
    nmea:
      set: true
      version: 65
      num_sv: 8
      sv_numbering: 1
      compat: true
      consider: true
      limit82: true
      high_prec: false
      filter:
        pos: false
        msk_pos: true
        time: true
        date: true
        gps_only: true
        track: true
      gnssToFilter:
        gps: false
        sbas: true
        qzss: true
        glonass: false
        beidou: true
      main_talker_id: 1
      gsv_talker_id: 1
      bds_talker_id: [0, 0]
    publish:
      all: false
      nav:
        all: true
        relposned: true
        posllh: true
        posecef: true
      nmea: true
